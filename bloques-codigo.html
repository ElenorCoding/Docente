<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uní cada bloque con su código</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF3F5;
    --grid-line:#DCE6EA;
    --ink:#182530;
    --ink-soft:#4C5C66;
    --editor-bg:#182430;
    --editor-text:#E4ECEF;
    --editor-keyword:#8FC7B8;
    --card-radius:14px;
    --amber:#D99A3B;
    --coral:#C9634E;
    --teal:#3E8E86;
    --violet:#7568A8;
    --olive:#84945A;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 100% 42px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 42px 100%,
      var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    padding:40px 20px 80px;
  }

  .stage{
    max-width:1080px;
    margin:0 auto;
  }

  header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(28px, 4vw, 40px);
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }

  header p{
    max-width:60ch;
    color:var(--ink-soft);
    font-size:16.5px;
    line-height:1.6;
    margin:0 0 6px;
  }

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin:24px 0 18px;
  }

  .members-field{
    margin-top:28px;
  }

  .members-field label{
    display:block;
    font-family:'Fraunces', serif;
    font-size:16px;
    font-weight:600;
    margin-bottom:10px;
  }

  .members-field input{
    width:100%;
    border:1.5px solid #C4D1D6;
    border-radius:10px;
    padding:12px 16px;
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    color:var(--ink);
    background:#fff;
  }
  .members-field input:focus{ outline:2px solid var(--teal); outline-offset:1px; }

  .col-title{
    font-family:'Fraunces', serif;
    font-size:15px;
    font-weight:600;
    color:var(--ink-soft);
    margin:0 0 14px;
  }

  #btn-reset{
    background:none;
    border:1px solid #B9C6CC;
    color:var(--ink-soft);
    font-family:'Inter', sans-serif;
    font-size:13px;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  #btn-reset:hover{ border-color:var(--ink); color:var(--ink); }

  .board{
    position:relative;
    display:grid;
    grid-template-columns:1fr 1fr;
    column-gap:200px;
    row-gap:18px;
    align-items:stretch;
  }

  #lines-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:visible;
  }

  .conn-line{
    fill:none;
    stroke-width:3;
    stroke-linecap:round;
    opacity:.85;
  }
  .temp-line{
    fill:none;
    stroke:#8A99A1;
    stroke-width:2.5;
    stroke-dasharray:6 6;
  }

  .card{
    position:relative;
    border-radius:var(--card-radius);
    padding:18px 22px;
  }

  .block-card{
    background:color-mix(in srgb, var(--accent) 16%, white);
    border:1.5px solid color-mix(in srgb, var(--accent) 45%, white);
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .image-slot{
    width:100%;
    height:132px;
    border-radius:10px;
    border:2px dashed color-mix(in srgb, var(--accent) 60%, #8b8b8b);
    background:color-mix(in srgb, var(--accent) 6%, white);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink-soft);
    font-size:13px;
    text-align:center;
    padding:8px;
    margin-bottom:12px;
  }

  .image-slot svg{ width:26px; height:26px; margin-right:8px; opacity:.55; flex-shrink:0; }

  .caption{
    margin:0;
    font-size:14px;
    font-weight:500;
    color:var(--ink);
  }

  .code-card{
    background:var(--editor-bg);
    color:var(--editor-text);
    min-height:150px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .code-card pre{
    margin:0;
    font-family:'JetBrains Mono', monospace;
    font-size:14.5px;
    line-height:1.65;
    white-space:pre-wrap;
    word-break:break-word;
  }

  .code-slot{
    width:100%;
    min-height:80px;
    border-radius:10px;
    border:2px dashed #4C5C66;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#8FA0A8;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    text-align:center;
    padding:8px;
  }

  .kw{ color:var(--editor-keyword); }

  .connector{
    position:absolute;
    top:50%;
    width:26px;
    height:26px;
    margin-top:-13px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:grab;
    touch-action:none;
    z-index:5;
  }
  .connector::after{
    content:"";
    width:12px;
    height:12px;
    border-radius:50%;
    background:#fff;
    border:3px solid var(--dot, var(--ink));
    transition:transform .12s ease;
  }
  .connector:active{ cursor:grabbing; }
  .connector:active::after,
  .connector.connected::after{ transform:scale(1.15); }

  .block-card .connector{ right:-13px; }
  .code-card .connector{ left:-13px; }
  .code-card .connector::after{ border-color:#9FB0B8; }
  .code-card .connector.connected::after{ border-color:#E4ECEF; }

  .answer-section{
    margin-top:56px;
    padding-top:28px;
    border-top:1px solid #CBD8DC;
  }

  .answer-section label{
    display:block;
    font-family:'Fraunces', serif;
    font-size:16px;
    font-weight:600;
    margin-bottom:10px;
  }

  textarea{
    width:100%;
    min-height:110px;
    resize:vertical;
    border:1.5px solid #C4D1D6;
    border-radius:10px;
    padding:14px 16px;
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    color:var(--ink);
    background:#fff;
    line-height:1.55;
  }
  textarea:focus{ outline:2px solid var(--teal); outline-offset:1px; }

  .submit-row{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:16px;
    flex-wrap:wrap;
  }

  #btn-enviar{
    background:var(--ink);
    color:#fff;
    border:none;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14.5px;
    padding:13px 26px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  #btn-enviar:hover{ background:#2C3D48; }
  #btn-enviar:active{ transform:scale(.97); }

  .status{ font-size:14px; }
  .status.ok{ color:var(--teal); font-weight:500; }
  .status.error{ color:var(--coral); font-weight:500; }

  @media (max-width:760px){
    .board{ grid-template-columns:1fr; gap:56px; }
    .image-slot{ height:110px; }
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <h1>Actualizando al Robot 2.0</h1>
    <p>Arrastrá desde el punto de cada bloque hasta el punto del tramo de código que le corresponde. Tocá un punto ya conectado para soltar esa unión.</p>
  </header>

  <div class="members-field">
    <label for="miembros">Miembros del grupo (Nombres y apellidos)</label>
    <input type="text" id="miembros" placeholder="Coloquen los nombres y apellidos del equipo de investigadores aquí">
  </div>

  <div class="toolbar">
    <span></span>
    <button id="btn-reset" type="button">Borrar uniones</button>
  </div>

  <div class="board" id="board">
    <svg id="lines-svg"></svg>

    <p class="col-title">Bloques</p>
    <p class="col-title">Código</p>

    <div class="card block-card" data-id="b1" style="--accent:#D99A3B; --dot:#D99A3B;">
      <div class="image-slot" id="block-img-1" data-slot="1">
	          <img src="img/ejemplo4.png">
      </div>
      <div class="connector" data-side="right" data-id="b1"></div>
    </div>
    <div class="card code-card" data-id="c1">
      <div class="connector" data-side="left" data-id="c1"></div>
      <pre><code>puntos = 10</code></pre>
    </div>

    <div class="card block-card" data-id="b2" style="--accent:#C9634E; --dot:#C9634E;">
      <div class="image-slot" id="block-img-2" data-slot="2">
        <img src="img/ejemplo1.png">
      </div>
      <div class="connector" data-side="right" data-id="b2"></div>
    </div>
    <div class="card code-card" data-id="c2">
      <div class="connector" data-side="left" data-id="c2"></div>
      <pre><code><span class="kw">print</span>(<span class="kw">"¡Hola!"</span>)</code></pre>
    </div>

    <div class="card block-card" data-id="b3" style="--accent:#3E8E86; --dot:#3E8E86;">
      <div class="image-slot" id="block-img-3" data-slot="3">
	          <img src="img/ejemplo5.png">  
      </div>
      <div class="connector" data-side="right" data-id="b3"></div>
    </div>
    <div class="card code-card" data-id="c3">
      <div class="connector" data-side="left" data-id="c3"></div>
      <pre><code><span class="kw">if</span> puntos &gt; 5:</code></pre>
    </div>

    <div class="card block-card" data-id="b4" style="--accent:#7568A8; --dot:#7568A8;">
      <div class="image-slot" id="block-img-4" data-slot="4">
	          <img src="img/ejemplo2.png">        
      </div>
      <div class="connector" data-side="right" data-id="b4"></div>
    </div>
    <div class="card code-card" data-id="c4">
      <div class="connector" data-side="left" data-id="c4"></div>
      <pre><code><span class="kw">for</span> veces <span class="kw">in</span> range(5):</code></pre>
    </div>

    <div class="card block-card" data-id="b5" style="--accent:#84945A; --dot:#84945A;">
      <div class="image-slot" id="block-img-5" data-slot="5">
	          <img src="img/ejemplo3.png">
      </div>
      <div class="connector" data-side="right" data-id="b5"></div>
    </div>
    <div class="card code-card" data-id="c5">
      <div class="connector" data-side="left" data-id="c5"></div>
      <pre><code><span class="kw">while</span> puntos &gt; 0:</code></pre>
    </div>
  </div>

  <div class="answer-section">
    <label for="respuesta">¡Investigadores! ¿Cuál fue su razonamiento?</label>
    <textarea id="respuesta" placeholder="Cuenten por qué unieron cada bloque con ese código..."></textarea>
    <div class="submit-row">
      <button id="btn-enviar" type="button">Enviar respuesta</button>
      <span class="status" id="status-msg"></span>
    </div>
  </div>
</div>

<script>
  // Integración con backend:
  // Para cargar las imágenes de cada bloque, seleccionar el contenedor por su id
  // (block-img-1 ... block-img-5) y setear background-image o insertar un <img>.
  // Ejemplo: document.getElementById('block-img-1').style.cssText += `background-image:url('...'); background-size:cover;`;

  // Pegá acá la URL que te da Formspree al crear el formulario (formspree.io/f/xxxxxxxx)
  const FORM_ENDPOINT = "https://formspree.io/f/TU_ID_AQUI";

  const board = document.getElementById('board');
  const svg = document.getElementById('lines-svg');
  const connectors = Array.from(document.querySelectorAll('.connector'));
  let connections = {}; // blockId -> codeId

  function resizeSvg(){
    const b = board.getBoundingClientRect();
    svg.setAttribute('width', b.width);
    svg.setAttribute('height', b.height);
    svg.setAttribute('viewBox', `0 0 ${b.width} ${b.height}`);
  }

  function pointFor(el){
    const r = el.getBoundingClientRect();
    const b = board.getBoundingClientRect();
    return { x: r.left + r.width/2 - b.left, y: r.top + r.height/2 - b.top };
  }

  function pathBetween(p1, p2){
    const dx = Math.max(60, Math.abs(p2.x - p1.x) / 2);
    return `M ${p1.x} ${p1.y} C ${p1.x+dx} ${p1.y}, ${p2.x-dx} ${p2.y}, ${p2.x} ${p2.y}`;
  }

  function render(){
    resizeSvg();
    svg.querySelectorAll('.conn-line').forEach(el => el.remove());

    Object.entries(connections).forEach(([blockId, codeId]) => {
      const bConn = connectors.find(c => c.dataset.id === blockId && c.dataset.side === 'right');
      const cConn = connectors.find(c => c.dataset.id === codeId && c.dataset.side === 'left');
      if(!bConn || !cConn) return;
      const p1 = pointFor(bConn), p2 = pointFor(cConn);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pathBetween(p1, p2));
      path.setAttribute('class', 'conn-line');
      const accent = document.querySelector(`.block-card[data-id="${blockId}"]`).style.getPropertyValue('--accent').trim();
      path.setAttribute('stroke', accent || '#182530');
      svg.appendChild(path);
    });

    connectors.forEach(c => {
      const id = c.dataset.id, side = c.dataset.side;
      const connected = side === 'right' ? !!connections[id] : Object.values(connections).includes(id);
      c.classList.toggle('connected', connected);
    });
  }

  function disconnect(side, id){
    if(side === 'right'){
      delete connections[id];
    } else {
      Object.keys(connections).forEach(k => { if(connections[k] === id) delete connections[k]; });
    }
  }

  function connect(sideA, idA, sideB, idB){
    const blockId = sideA === 'right' ? idA : idB;
    const codeId = sideA === 'right' ? idB : idA;
    delete connections[blockId];
    Object.keys(connections).forEach(k => { if(connections[k] === codeId) delete connections[k]; });
    connections[blockId] = codeId;
  }

  connectors.forEach(conn => {
    conn.addEventListener('pointerdown', e => {
      e.preventDefault();
      const side = conn.dataset.side, id = conn.dataset.id;
      const startPt = pointFor(conn);
      let moved = false;

      const tmp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      tmp.setAttribute('class', 'temp-line');
      svg.appendChild(tmp);

      function onMove(ev){
        moved = true;
        const b = board.getBoundingClientRect();
        const x = ev.clientX - b.left, y = ev.clientY - b.top;
        const dx = Math.max(60, Math.abs(x - startPt.x) / 2);
        const d = side === 'right'
          ? `M ${startPt.x} ${startPt.y} C ${startPt.x+dx} ${startPt.y}, ${x-dx} ${y}, ${x} ${y}`
          : `M ${startPt.x} ${startPt.y} C ${startPt.x-dx} ${startPt.y}, ${x+dx} ${y}, ${x} ${y}`;
        tmp.setAttribute('d', d);
      }

      function onUp(ev){
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        tmp.remove();

        const target = document.elementFromPoint(ev.clientX, ev.clientY);
        const targetConn = target && target.closest ? target.closest('.connector') : null;

        if(!moved){
          disconnect(side, id);
          render();
          return;
        }
        if(targetConn && targetConn.dataset.side !== side){
          connect(side, id, targetConn.dataset.side, targetConn.dataset.id);
        }
        render();
      }

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp, { once:true });
    });
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    connections = {};
    render();
    document.getElementById('status-msg').textContent = '';
  });

  window.addEventListener('resize', render);

  document.getElementById('btn-enviar').addEventListener('click', async () => {
    const respuesta = document.getElementById('respuesta').value.trim();
    const miembros = document.getElementById('miembros').value.trim();
    const uniones = Object.entries(connections).map(([bloque, codigo]) => ({ bloque, codigo }));
    const payload = { miembros, uniones, comentario: respuesta, fecha: new Date().toISOString() };
    const status = document.getElementById('status-msg');
    const boton = document.getElementById('btn-enviar');

    if(uniones.length === 0){
      status.textContent = 'Conectá al menos un bloque con su código antes de enviar.';
      status.className = 'status error';
      return;
    }

    boton.disabled = true;
    boton.textContent = 'Enviando...';
    status.textContent = '';
    status.className = 'status';

    try{
      const res = await fetch(FORM_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      if(res.ok){
        status.textContent = `¡Respuesta enviada! (${uniones.length} de 5 uniones)`;
        status.className = 'status ok';
      } else {
        status.textContent = 'Hubo un problema al enviar. Probá de nuevo en un momento.';
        status.className = 'status error';
      }
    } catch(err){
      status.textContent = 'No se pudo conectar. Revisá tu conexión e intentá de nuevo.';
      status.className = 'status error';
    } finally {
      boton.disabled = false;
      boton.textContent = 'Enviar respuesta';
    }
  });

  render();
</script>
</body>
</html>
